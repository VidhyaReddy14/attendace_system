<!DOCTYPE html>
<html>

<head>
    <title>Edit Student - Attendance Management System</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
            margin: 0;
        }

        header {
            background-color: #1769aa;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 50%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            text-align: center;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 25px;
            background-color: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Attendance Management System</h1>
    <p>Edit Student Details</p>
</header>

<div class="container">

    <h2>Edit Student</h2>

    <form method="POST">

        <input
            type="text"
            name="roll_no"
            value="{{ student.roll_no }}"
            placeholder="Roll Number"
            required
        >

        <input
            type="text"
            name="name"
            value="{{ student.name }}"
            placeholder="Student Name"
            required
        >

        <input
            type="number"
            name="total_classes"
            value="{{ student.total_classes }}"
            placeholder="Total Classes"
            required
        >

        <input
            type="number"
            name="attended_classes"
            value="{{ student.attended_classes }}"
            placeholder="Attended Classes"
            required
        >

        <br>

        <button type="submit">
            Update Student
        </button>

    </form>

    <br>

    <a href="/">
        ← Back to Home
    </a>

</div>

</body>

</html>
